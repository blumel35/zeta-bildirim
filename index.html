+  // GEÇİCİ — yerel bildirim testi (bkz. yukarıdaki HTML yorumu).
+  var btnYerelTest = document.getElementById('btnYerelTest');
+  btnYerelTest.addEventListener('click', function () {
+    if (!('serviceWorker' in navigator)) {
+      durumYaz('Bu tarayıcı Service Worker desteklemiyor.');
+      return;
+    }
+    if (Notification.permission !== 'granted') {
+      durumYaz('Önce yukarıdaki "Bildirimleri Aç" ile izin vermen lazım (şu an: ' + Notification.permission + ').');
+      return;
+    }
+    navigator.serviceWorker.getRegistration('./sw.js')
+      .then(function (reg) {
+        if (!reg) {
+          durumYaz('Bu cihazda kayıtlı Service Worker yok — önce "Bildirimleri Aç"a bas.');
+          return;
+        }
+        return reg.showNotification('Yerel Test', {
+          body: 'Service Worker bildirim gösterebiliyor. (internet/push YOK, yerel test)',
+          icon: 'icons/icon-192.png',
+        }).then(function () {
+          durumYaz('Yerel bildirim tetiklendi — ekranını/bildirim çubuğunu kontrol et.');
+        });
+      })
+      .catch(function (e) {
+        durumYaz('Yerel test hatası: ' + (e && e.message ? e.message : e));
+      });
+  });
 })();
